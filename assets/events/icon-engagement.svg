      <stop offset=".55" stop-color="#C99A3E"/>
      <stop offset="1" stop-color="#8A6118"/>
    </radialGradient>
    <linearGradient id="iconEngagement-petalG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFF4F7"/>
      <stop offset=".4" stop-color="#FFD1DF"/>
      <stop offset=".78" stop-color="#F48FB1"/>
      <stop offset="1" stop-color="#E8638F"/>
    </linearGradient>
    <linearGradient id="iconEngagement-petalBack" x1="0" y1="1" x2="0" y2="0">
