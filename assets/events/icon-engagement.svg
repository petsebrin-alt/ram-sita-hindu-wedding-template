      <stop offset=".5" stop-color="#F6E3A6"/>
      <stop offset=".7" stop-color="#B8862B"/>
      <stop offset="1" stop-color="#6E4A12"/>
    </linearGradient>
    <linearGradient id="iconEngagement-goldRev" x1="220" y1="226" x2="20" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A6118"/>
      <stop offset=".3" stop-color="#D4AF5A"/>
      <stop offset=".5" stop-color="#F6E3A6"/>
      <stop offset=".7" stop-color="#B8862B"/>
      <stop offset="1" stop-color="#6E4A12"/>
    </linearGradient>
    <radialGradient id="iconEngagement-pearl" cx=".35" cy=".3" r=".75">
