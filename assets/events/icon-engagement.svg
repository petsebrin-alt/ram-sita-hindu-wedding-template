  <!-- ===== MEDALLION ===== -->
  <use xlink:href="#iconEngagement-scallop" href="#iconEngagement-scallop" fill="#3B1F10" opacity=".35" transform="translate(0 3)" filter="url(#iconEngagement-soft)"/>
  <use xlink:href="#iconEngagement-scallop" href="#iconEngagement-scallop" fill="url(#iconEngagement-gold)" stroke="#5E3F0C" stroke-width="1"/>
  <use xlink:href="#iconEngagement-scallop" href="#iconEngagement-scallop" fill="none" stroke="#F6E3A6" stroke-width=".7" opacity=".75" transform="translate(120 120) scale(.965) translate(-120 -120)"/>
  <use xlink:href="#iconEngagement-pearls" href="#iconEngagement-pearls"/>
  <circle cx="120" cy="120" r="103" fill="url(#iconEngagement-goldRev)" stroke="#5E3F0C" stroke-width=".9"/>
  <circle cx="120" cy="120" r="100.6" fill="none" stroke="#F6E3A6" stroke-width=".6" opacity=".7"/>
  <circle cx="120" cy="120" r="96" fill="none" stroke="#6B0F24" stroke-width="5.6"/>
  <circle cx="120" cy="120" r="96" fill="none" stroke="#4A0A1A" stroke-width=".5" opacity=".6"/>
  <circle cx="120" cy="120" r="96" fill="none" stroke="url(#iconEngagement-gold)" stroke-width="2.8" stroke-dasharray="0 5.03" stroke-linecap="round"/>
  <circle cx="120" cy="120" r="92.6" fill="url(#iconEngagement-gold)" stroke="#5E3F0C" stroke-width=".8"/>
  <circle cx="120" cy="120" r="90" fill="url(#iconEngagement-field)" stroke="#5E3F0C" stroke-width=".7"/>
  <circle cx="120" cy="120" r="85.5" fill="none" stroke="#B8862B" stroke-width=".6" stroke-dasharray="1 2.6" opacity=".55"/>
  <use xlink:href="#iconEngagement-boss" href="#iconEngagement-boss"/>
  <use xlink:href="#iconEngagement-boss" href="#iconEngagement-boss" transform="rotate(90 120 120)"/>
  <use xlink:href="#iconEngagement-boss" href="#iconEngagement-boss" transform="rotate(180 120 120)"/>
  <use xlink:href="#iconEngagement-boss" href="#iconEngagement-boss" transform="rotate(270 120 120)"/>

  <!-- ===== MOTIF: sagai rings on a lotus in a brass thali ===== -->
  <!-- thali -->
  <g transform="translate(0 5)">
  <ellipse cx="120" cy="174" rx="66" ry="10" fill="#5C3317" opacity=".25" filter="url(#iconEngagement-soft)"/>
  <ellipse cx="120" cy="166" rx="70" ry="19.5" fill="#5E3F0C"/>
  <ellipse cx="120" cy="165" rx="70" ry="19.5" fill="url(#iconEngagement-brass)"/>
  <ellipse cx="120" cy="162" rx="70" ry="19" fill="url(#iconEngagement-brass)" stroke="#5E3F0C" stroke-width=".8"/>
  <ellipse cx="120" cy="163" rx="57" ry="14.2" fill="url(#iconEngagement-plateWell)" stroke="#5E3F0C" stroke-width=".7"/>
  <ellipse cx="120" cy="162.6" rx="63.6" ry="16.8" fill="none" stroke="#5E3F0C" stroke-width="1.1" stroke-dasharray=".1 3.1" stroke-linecap="round"/>
  <path d="M54 166 C70 177 96 181.6 120 181.6 C144 181.6 170 177 186 166" fill="none" stroke="#FFF6D2" stroke-width="1" opacity=".7"/>
  <ellipse cx="120" cy="164" rx="40" ry="8" fill="#F6E3A6" opacity=".25"/>

  </g>
  <g transform="translate(120 162) scale(1.42) translate(-120 -162)">
  <!-- mango leaves under the lotus -->
  <use xlink:href="#iconEngagement-mangoLeaf" href="#iconEngagement-mangoLeaf" transform="translate(108 158) rotate(-74) scale(.66)"/>
  <use xlink:href="#iconEngagement-mangoLeaf" href="#iconEngagement-mangoLeaf" transform="translate(132 158) rotate(74) scale(.66)"/>

  <!-- lotus: back row -->
  <use xlink:href="#iconEngagement-petB" href="#iconEngagement-petB" transform="translate(120 150) rotate(-58) scale(.86)"/>
  <use xlink:href="#iconEngagement-petB" href="#iconEngagement-petB" transform="translate(120 150) rotate(58) scale(.86)"/>
  <use xlink:href="#iconEngagement-petB" href="#iconEngagement-petB" transform="translate(120 150) rotate(-30) scale(.98)"/>
  <use xlink:href="#iconEngagement-petB" href="#iconEngagement-petB" transform="translate(120 150) rotate(30) scale(.98)"/>
  <use xlink:href="#iconEngagement-petB" href="#iconEngagement-petB" transform="translate(120 150) scale(1.04)"/>
  <!-- lotus: middle row -->
  <use xlink:href="#iconEngagement-pet" href="#iconEngagement-pet" transform="translate(120 152) rotate(-82) scale(.82 .8)"/>
  <use xlink:href="#iconEngagement-pet" href="#iconEngagement-pet" transform="translate(120 152) rotate(82) scale(.82 .8)"/>
  <use xlink:href="#iconEngagement-pet" href="#iconEngagement-pet" transform="translate(120 151) rotate(-46) scale(.9)"/>
  <use xlink:href="#iconEngagement-pet" href="#iconEngagement-pet" transform="translate(120 151) rotate(46) scale(.9)"/>
  <use xlink:href="#iconEngagement-pet" href="#iconEngagement-pet" transform="translate(120 151) rotate(-15) scale(.82)"/>
  <use xlink:href="#iconEngagement-pet" href="#iconEngagement-pet" transform="translate(120 151) rotate(15) scale(.82)"/>

  <!-- seed pod & stamens -->
  <g stroke="#E8A21A" stroke-width=".9" stroke-linecap="round">
    <path d="M104 137 L101 133.6 M107 134.6 L105.4 130.6 M111 133.4 L110.4 129.2 M116 132.8 L116 128.6 M124 132.8 L124 128.6 M129 133.4 L129.6 129.2 M133 134.6 L134.6 130.6 M136 137 L139 133.6"/>
  </g>
  <g fill="#F7C744">
    <circle cx="101" cy="133.6" r="1"/><circle cx="105.4" cy="130.6" r="1"/><circle cx="110.4" cy="129.2" r="1"/><circle cx="116" cy="128.6" r="1"/>
    <circle cx="124" cy="128.6" r="1"/><circle cx="129.6" cy="129.2" r="1"/><circle cx="134.6" cy="130.6" r="1"/><circle cx="139" cy="133.6" r="1"/>
  </g>
  <ellipse cx="120" cy="138" rx="15" ry="6" fill="url(#iconEngagement-pod)" stroke="#8A6118" stroke-width=".6"/>
  <g fill="#8A6118">
    <circle cx="113" cy="137.4" r="1"/><circle cx="118" cy="136" r="1"/><circle cx="123" cy="136.4" r="1"/><circle cx="127.6" cy="138" r="1"/>
    <circle cx="115.6" cy="140" r="1"/><circle cx="121" cy="139.8" r="1"/><circle cx="110" cy="139.4" r=".8"/>
  </g>

  <!-- two gold rings, interlinked -->
  <g>
    <ellipse cx="0" cy="0" rx="12.5" ry="15.5" transform="translate(112.5 123.5) rotate(-14)" fill="none" stroke="#3B1F10" stroke-width="5.6" opacity=".28"/>
    <ellipse cx="0" cy="0" rx="11" ry="15.8" transform="translate(126.5 121.5) rotate(16)" fill="none" stroke="#3B1F10" stroke-width="5.6" opacity=".28"/>
    <!-- ring A -->
    <g transform="translate(112 122) rotate(-14)">
        <ellipse rx="12.5" ry="15.5" fill="none" stroke="#5E3F0C" stroke-width="5.4"/>
        <ellipse rx="12.5" ry="15.5" fill="none" stroke="url(#iconEngagement-ringG)" stroke-width="4.2"/>
        <ellipse rx="10.2" ry="13.2" fill="none" stroke="#6E4A12" stroke-width=".7"/>
        <path d="M-10.4 -8 A12.5 15.5 0 0 1 4 -14.8" fill="none" stroke="#FFFBEA" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>
      </g>
    <!-- ring B -->
    <g transform="translate(126 120) rotate(16)">
      <ellipse rx="11" ry="15.8" fill="none" stroke="#5E3F0C" stroke-width="5.4"/>
      <ellipse rx="11" ry="15.8" fill="none" stroke="url(#iconEngagement-ringG)" stroke-width="4.2"/>
      <ellipse rx="8.7" ry="13.5" fill="none" stroke="#6E4A12" stroke-width=".7"/>
      <path d="M-9.4 -7.4 A11 15.8 0 0 1 3 -15.2" fill="none" stroke="#FFFBEA" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>
      <!-- small kundan-set ruby on the band -->
      <g transform="translate(0 -15.8)">
        <circle r="3.6" fill="url(#iconEngagement-ringG)" stroke="#5E3F0C" stroke-width=".6"/>
        <circle r="2.1" fill="url(#iconEngagement-gem)" stroke="#4A0A1A" stroke-width=".4"/>
        <circle cx="-.7" cy="-.8" r=".6" fill="#FFE3EA"/>
      </g>
    </g>
    <!-- ring A re-drawn over B at the upper crossing so the rings interlink -->
    <g clip-path="url(#iconEngagement-topCross)">
      <g transform="translate(112 122) rotate(-14)">
        <ellipse rx="12.5" ry="15.5" fill="none" stroke="#5E3F0C" stroke-width="5.4"/>
        <ellipse rx="12.5" ry="15.5" fill="none" stroke="url(#iconEngagement-ringG)" stroke-width="4.2"/>
        <ellipse rx="10.2" ry="13.2" fill="none" stroke="#6E4A12" stroke-width=".7"/>
        <path d="M-10.4 -8 A12.5 15.5 0 0 1 4 -14.8" fill="none" stroke="#FFFBEA" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>
      </g>
    </g>
  </g>

  <!-- lotus: front row curling toward viewer (seats the rings) -->
  <use xlink:href="#iconEngagement-pet" href="#iconEngagement-pet" transform="translate(120 140) rotate(-118) scale(.62 .55)"/>
  <use xlink:href="#iconEngagement-pet" href="#iconEngagement-pet" transform="translate(120 140) rotate(118) scale(.62 .55)"/>
  <use xlink:href="#iconEngagement-pet" href="#iconEngagement-pet" transform="translate(112 140) rotate(-150) scale(.6 .44)"/>
  <use xlink:href="#iconEngagement-pet" href="#iconEngagement-pet" transform="translate(128 140) rotate(150) scale(.6 .44)"/>
  <use xlink:href="#iconEngagement-pet" href="#iconEngagement-pet" transform="translate(120 140) rotate(180) scale(.74 .42)"/>

  </g>
  <g transform="translate(0 5)">
  <!-- akshat (rice) and kumkum on the thali -->
  <g fill="#FBF5E6" stroke="#C9B48A" stroke-width=".3">
    <ellipse cx="70" cy="166" rx="1.6" ry=".8" transform="rotate(20 70 166)"/>
    <ellipse cx="76" cy="171" rx="1.6" ry=".8" transform="rotate(-30 76 171)"/>
    <ellipse cx="164" cy="170" rx="1.6" ry=".8" transform="rotate(30 164 170)"/>
    <ellipse cx="171" cy="164" rx="1.6" ry=".8" transform="rotate(-10 171 164)"/>
    <ellipse cx="86" cy="174" rx="1.6" ry=".8" transform="rotate(5 86 174)"/>
    <ellipse cx="154" cy="175" rx="1.6" ry=".8" transform="rotate(-20 154 175)"/>
  </g>
  <g fill="#B5122E">
    <circle cx="80" cy="166" r="1.2"/><circle cx="160" cy="166" r="1.2"/><circle cx="93" cy="176" r="1"/><circle cx="147" cy="177" r="1"/>
  </g>
  </g>
</svg>
