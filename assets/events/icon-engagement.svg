      <path d="M120 11.5 L125.2 19 L120 26.5" fill="none" stroke="#F6E3A6" stroke-width=".6" opacity=".8"/>
      <circle cx="120" cy="19" r="3.3" fill="url(#iconEngagement-gem)" stroke="#5E3F0C" stroke-width=".5"/>
      <circle cx="118.9" cy="17.9" r=".9" fill="#FFE3EA" opacity=".85"/>
    </g>

    <!-- ===== motif defs ===== -->
    <linearGradient id="iconEngagement-brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E4A12"/>
      <stop offset=".22" stop-color="#B8862B"/>
      <stop offset=".42" stop-color="#F6E3A6"/>
      <stop offset=".6" stop-color="#D4AF5A"/>
      <stop offset=".85" stop-color="#8A6118"/>
      <stop offset="1" stop-color="#5E3F0C"/>
    </linearGradient>
