      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(82.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(97.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(112.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(127.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(142.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(157.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(172.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(187.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(202.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(217.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(232.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(247.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(262.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(277.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(292.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(307.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(322.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(337.5 120 120)"/>
      <use xlink:href="#iconEngagement-p" href="#iconEngagement-p" transform="rotate(352.5 120 120)"/>
    </g>
    <g id="iconEngagement-boss">
