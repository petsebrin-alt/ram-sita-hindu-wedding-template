    <path id="iconEngagement-vein" d="M0 -3 L0 -45 M0 -7 C-4.4 -17 -5.4 -30 -2.4 -41 M0 -7 C4.4 -17 5.4 -30 2.4 -41" fill="none" stroke="#D24E7C" stroke-width=".5" opacity=".55"/>
