    <use href="#cornerBR-spec" fill="none" stroke="#FFF7DA" stroke-width=".8" stroke-linecap="round" stroke-dasharray="78 100" opacity=".6" transform="translate(-.4,-.5) matrix(-1 0 0 -1 300 300)"/>
