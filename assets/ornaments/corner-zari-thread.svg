<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Zari (gold thread) embroidery corner, top-left. Couched gold cords with tiny tie-down
       stitches, bead rows, scroll vines, satin-stitched gold leaves and a zari rosette.
       The bead-work lotus sits in the open space at about (112, 112) - placed by the page. -->
  <defs>
    <linearGradient id="zg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6118"/><stop offset=".25" stop-color="#e2bd66"/><stop offset=".45" stop-color="#fbe9b0"/>
      <stop offset=".62" stop-color="#c8962e"/><stop offset=".82" stop-color="#f0d27e"/><stop offset="1" stop-color="#7a5412"/>
    </linearGradient>
    <radialGradient id="zb" cx=".5" cy=".5" r=".5" fx=".35" fy=".3">
      <stop offset="0" stop-color="#fffbe6"/><stop offset=".3" stop-color="#f6e3a6"/><stop offset=".7" stop-color="#c99a3a"/><stop offset="1" stop-color="#6a470e"/>
    </radialGradient>
    <radialGradient id="zp" cx=".5" cy=".5" r=".5" fx=".36" fy=".3">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#fbf3e2"/><stop offset="1" stop-color="#d9c7a3"/>
    </radialGradient>
    <linearGradient id="zl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6a1a"/><stop offset=".5" stop-color="#f3d68a"/><stop offset="1" stop-color="#a87a22"/>
    </linearGradient>

    <!-- cord paths -->
    <path id="outer" d="M16 396 V52 Q16 16 52 16 H396"/>
    <path id="inner" d="M34 396 V64 Q34 34 64 34 H396"/>
    <path id="vineTop" d="M74 52 C108 40 128 70 160 58 S210 34 238 50 S288 76 316 56 Q332 44 348 52"/>
    <path id="vineLeft" d="M52 74 C40 108 70 128 58 160 S34 210 50 238 S76 288 56 316 Q44 332 52 348"/>
    <path id="curlTop" d="M238 50 c6 -18 30 -18 32 -2 c2 12 -14 16 -18 6 c-2 -6 4 -9 7 -6"/>
    <path id="curlLeft" d="M50 238 c-18 6 -18 30 -2 32 c12 2 16 -14 6 -18 c-6 -2 -9 4 -6 7"/>
    <path id="curlTop2" d="M160 58 c4 14 22 18 30 8 c6 -8 -2 -18 -10 -12 c-4 3 -2 9 3 8"/>
    <path id="curlLeft2" d="M58 160 c14 4 18 22 8 30 c-8 6 -18 -2 -12 -10 c3 -4 9 -2 8 3"/>

    <!-- satin-stitched gold leaf (points right, base at 0,0) -->
    <g id="leaf">
      <path d="M0 0 C10 -10 26 -10 36 0 C26 10 10 10 0 0Z" fill="url(#zl)" stroke="#7a5412" stroke-width=".8"/>
      <path d="M3 0 H33 M8 -1 L12 -5 M14 -1 L18 -6 M20 -1 L24 -6 M26 -1 L29 -4 M8 1 L12 5 M14 1 L18 6 M20 1 L24 6 M26 1 L29 4"
            stroke="#7a5412" stroke-width=".7" stroke-linecap="round" opacity=".7"/>
    </g>
  </defs>

  <!-- 1. outer couched cord: gold base, tie-down stitches, light catching the twist -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#outer" stroke="url(#zg)" stroke-width="6"/>
    <use href="#outer" stroke="#6a470e" stroke-width="6" stroke-dasharray="1 4.2" opacity=".55"/>
    <use href="#outer" stroke="#fff4cf" stroke-width="1.3" stroke-dasharray="3 2.2" opacity=".75" transform="translate(-1 -1)"/>

    <!-- 2. inner cord -->
    <use href="#inner" stroke="url(#zg)" stroke-width="3.2"/>
    <use href="#inner" stroke="#6a470e" stroke-width="3.2" stroke-dasharray="1 3.4" opacity=".5"/>

    <!-- 3. scroll vines in couched cord -->
    <g stroke-width="3.4">
      <use href="#vineTop" stroke="url(#zg)"/><use href="#vineLeft" stroke="url(#zg)"/>
      <use href="#curlTop" stroke="url(#zg)" stroke-width="2.6"/><use href="#curlLeft" stroke="url(#zg)" stroke-width="2.6"/>
      <use href="#curlTop2" stroke="url(#zg)" stroke-width="2.4"/><use href="#curlLeft2" stroke="url(#zg)" stroke-width="2.4"/>
    </g>
    <g stroke="#6a470e" stroke-width="3.4" stroke-dasharray="1 3.6" opacity=".5">
      <use href="#vineTop"/><use href="#vineLeft"/>
    </g>
    <g stroke="#fff4cf" stroke-width="1" stroke-dasharray="2.6 2.4" opacity=".7">
      <use href="#vineTop" transform="translate(0 -1)"/><use href="#vineLeft" transform="translate(-1 0)"/>
    </g>
    <!-- 3b. couched stem leading from the rosette to the bead lotus -->
    <path d="M42 42 C58 66 74 84 100 104" stroke="url(#zg)" stroke-width="3"/>
    <path d="M42 42 C58 66 74 84 100 104" stroke="#6a470e" stroke-width="3" stroke-dasharray="1 3.4" opacity=".5"/>
  </g>

  <!-- 4. satin-stitched leaves on the vines -->
  <use href="#leaf" transform="translate(126 62) rotate(-30)"/>
  <use href="#leaf" transform="translate(70 76) rotate(52) scale(.75)"/>
  <use href="#leaf" transform="translate(200 46) rotate(20)"/>
  <use href="#leaf" transform="translate(276 66) rotate(-18)"/>
  <use href="#leaf" transform="translate(62 126) rotate(120) scale(1 -1)"/>
  <use href="#leaf" transform="translate(46 200) rotate(70) scale(1 -1)"/>
  <use href="#leaf" transform="translate(66 276) rotate(108) scale(1 -1)"/>

  <!-- 5. bead rows along the inner cord (pearls and gold beads) -->
  <g>
    <circle cx="90" cy="25" r="2.6" fill="url(#zp)"/><circle cx="120" cy="25" r="2.6" fill="url(#zb)"/>
    <circle cx="150" cy="25" r="2.6" fill="url(#zp)"/><circle cx="180" cy="25" r="2.6" fill="url(#zb)"/>
    <circle cx="210" cy="25" r="2.6" fill="url(#zp)"/><circle cx="240" cy="25" r="2.6" fill="url(#zb)"/>
    <circle cx="270" cy="25" r="2.6" fill="url(#zp)"/><circle cx="300" cy="25" r="2.6" fill="url(#zb)"/>
    <circle cx="330" cy="25" r="2.6" fill="url(#zp)"/><circle cx="360" cy="25" r="2.6" fill="url(#zb)"/>
    <circle cx="25" cy="90" r="2.6" fill="url(#zp)"/><circle cx="25" cy="120" r="2.6" fill="url(#zb)"/>
    <circle cx="25" cy="150" r="2.6" fill="url(#zp)"/><circle cx="25" cy="180" r="2.6" fill="url(#zb)"/>
    <circle cx="25" cy="210" r="2.6" fill="url(#zp)"/><circle cx="25" cy="240" r="2.6" fill="url(#zb)"/>
    <circle cx="25" cy="270" r="2.6" fill="url(#zp)"/><circle cx="25" cy="300" r="2.6" fill="url(#zb)"/>
    <circle cx="25" cy="330" r="2.6" fill="url(#zp)"/><circle cx="25" cy="360" r="2.6" fill="url(#zb)"/>
  </g>

  <!-- 6. french-knot clusters at the vine ends -->
  <g fill="url(#zb)">
    <circle cx="354" cy="50" r="3.4"/><circle cx="362" cy="56" r="2.4"/><circle cx="360" cy="45" r="2"/>
    <circle cx="50" cy="354" r="3.4"/><circle cx="56" cy="362" r="2.4"/><circle cx="45" cy="360" r="2"/>
    <circle cx="96" cy="96" r="2.2"/><circle cx="150" cy="100" r="2"/><circle cx="100" cy="150" r="2"/>
  </g>

  <!-- 7. zari rosette at the corner: eight satin petals around a bead -->
  <g transform="translate(25 25)">
    <g fill="url(#zl)" stroke="#6a470e" stroke-width=".8">
      <path d="M0 0 C-4 -8 -4 -16 0 -20 C4 -16 4 -8 0 0Z"/>
      <path d="M0 0 C-4 -8 -4 -16 0 -20 C4 -16 4 -8 0 0Z" transform="rotate(45)"/>
      <path d="M0 0 C-4 -8 -4 -16 0 -20 C4 -16 4 -8 0 0Z" transform="rotate(90)"/>
      <path d="M0 0 C-4 -8 -4 -16 0 -20 C4 -16 4 -8 0 0Z" transform="rotate(135)"/>
      <path d="M0 0 C-4 -8 -4 -16 0 -20 C4 -16 4 -8 0 0Z" transform="rotate(180)"/>
      <path d="M0 0 C-4 -8 -4 -16 0 -20 C4 -16 4 -8 0 0Z" transform="rotate(225)"/>
      <path d="M0 0 C-4 -8 -4 -16 0 -20 C4 -16 4 -8 0 0Z" transform="rotate(270)"/>
      <path d="M0 0 C-4 -8 -4 -16 0 -20 C4 -16 4 -8 0 0Z" transform="rotate(315)"/>
    </g>
    <circle r="6.5" fill="url(#zb)" stroke="#6a470e" stroke-width=".8"/>
    <circle r="2.6" fill="#a8183c"/>
  </g>
</svg>
