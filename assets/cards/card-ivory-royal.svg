<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="600" height="840">
  <defs>
    <radialGradient id="cardIvory-paper" gradientUnits="userSpaceOnUse" cx="300" cy="380" r="560">
      <stop offset="0" stop-color="#FBF5E6"/>
      <stop offset=".55" stop-color="#F6ECD4"/>
      <stop offset="1" stop-color="#EFE2C2"/>
    </radialGradient>
    <linearGradient id="cardIvory-foil" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="840">
      <stop offset="0" stop-color="#8A6118"/>
      <stop offset=".07" stop-color="#F6E3A6"/>
      <stop offset=".16" stop-color="#B8862B"/>
      <stop offset=".27" stop-color="#D4AF5A"/>
      <stop offset=".38" stop-color="#F6E3A6"/>
      <stop offset=".5" stop-color="#B8862B"/>
      <stop offset=".62" stop-color="#D4AF5A"/>
      <stop offset=".73" stop-color="#F6E3A6"/>
      <stop offset=".85" stop-color="#B8862B"/>
      <stop offset=".93" stop-color="#F6E3A6"/>
      <stop offset="1" stop-color="#6E4A12"/>
    </linearGradient>
    <linearGradient id="cardIvory-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A6118"/>
      <stop offset=".3" stop-color="#D4AF5A"/>
      <stop offset=".5" stop-color="#F6E3A6"/>
      <stop offset=".7" stop-color="#B8862B"/>
      <stop offset="1" stop-color="#6E4A12"/>
    </linearGradient>
    <linearGradient id="cardIvory-petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8A6118"/>
      <stop offset=".45" stop-color="#D4AF5A"/>
      <stop offset=".8" stop-color="#F6E3A6"/>
      <stop offset="1" stop-color="#E2C27A"/>
    </linearGradient>
    <radialGradient id="cardIvory-maroon" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#8B1A2E"/>
      <stop offset="1" stop-color="#4A0A1A"/>
    </radialGradient>
    <!-- very faint repeated paisley (buta) ground -->
    <g id="cardIvory-buta">
      <path d="M0,14C-10,14 -15,6 -14,-3C-13,-13 -5,-20 2,-27C7,-32 10,-38 16,-40C21,-41 22.5,-35.5 18.5,-34C15.5,-33 15,-36.5 17.2,-37.2M10.5,-35C16,-25 16,-12 13,-4C10,5 7,14 0,14" fill="none" stroke="#8A6118" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M0,8C-6,8 -8,3 -7.5,-2C-7,-8 -2,-12 2,-17C5,-11 6,-6 5,-1C4,4 3,8 0,8Z" fill="#8A6118"/>
      <circle cx="-1" cy="-24" r="1.6" fill="#8A6118"/>
    </g>
    <pattern id="cardIvory-butaPattern" width="80" height="92" patternUnits="userSpaceOnUse">
      <g fill="#8A6118">
        <use href="#cardIvory-buta" transform="translate(20 34) rotate(-14) scale(.46)"/>
        <use href="#cardIvory-buta" transform="translate(60 80) rotate(-14) scale(.46)"/>
        <circle cx="60" cy="24" r="1.3"/><circle cx="56.4" cy="21.6" r=".8"/><circle cx="63.6" cy="21.6" r=".8"/><circle cx="60" cy="19.4" r=".8"/>
        <circle cx="20" cy="70" r="1.3"/><circle cx="16.4" cy="67.6" r=".8"/><circle cx="23.6" cy="67.6" r=".8"/><circle cx="20" cy="65.4" r=".8"/>
      </g>
    </pattern>
    <!-- paper grain -->
    <filter id="cardIvory-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="11" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .42  0 0 0 0 .32  0 0 0 0 .16  0 0 0 .09 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="cardIvory-emboss" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation=".7"/>
      <feOffset dx=".7" dy=".9" result="o"/>
      <feFlood flood-color="#4A3008" flood-opacity=".45"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- front-view lotus emblem petals -->
    <path id="cardIvory-pO" d="M0,0C-12,-8.4 -10.8,-27.4 0,-38C10.8,-27.4 12,-8.4 0,0Z"/>
    <path id="cardIvory-pM" d="M0,0C-13.5,-9.2 -12.2,-30.2 0,-42C12.2,-30.2 13.5,-9.2 0,0Z"/>
    <path id="cardIvory-pI" d="M0,0C-12,-9.7 -10.8,-31.7 0,-44C10.8,-31.7 12,-9.7 0,0Z"/>
    <path id="cardIvory-pC" d="M0,0C-13,-10.1 -11.7,-33.1 0,-46C11.7,-33.1 13,-10.1 0,0Z"/>
    <g id="cardIvory-flourish">
      <path d="M322.2,105.1C336.1,103 350.5,101.4 365.3,101C380,100.5 394.9,101.2 409.9,103.6C418.9,105 425.1,108.1 428.4,111.6C431.7,115.1 431.8,118.1 427.8,120.7C424.8,122.7 422,122.2 420.1,120.6C418.2,119 417.7,116.7 420.2,114.2A0.3,0.3 0 0 1 419.8,113.8C417.3,116.3 417.8,119.5 419.6,121.1C421.5,122.8 425.2,123.3 428.2,121.3C432.2,118.9 432.3,114.4 429.1,110.9C425.9,107.4 419.1,104 410.1,102.4C395.1,99.8 380,99 365.2,99.3C350.5,99.6 335.9,101 321.8,102.9A1.1,1.1 0 0 1 322.2,105.1Z"/>
      <path d="M352.3,100.6C359.3,96.6 366.1,94.1 372.6,92.9C379.1,91.7 384.9,91.9 389.9,93.4C393.4,94.3 394.9,96.3 395.1,98.3C395.2,100.3 394,101.7 391,101.8A0.2,0.2 0 0 1 391,102.2C394,102.3 395.8,100.2 395.7,98.2C395.6,96.2 393.6,93.7 390.1,92.6C385.1,91.1 378.9,90.8 372.4,91.9C365.9,92.9 358.7,95.4 351.7,99.4A0.7,0.7 0 0 1 352.3,100.6Z"/>
      <circle cx="424.6" cy="117.2" r="1.6"/><circle cx="444" cy="110" r="1.3"/><circle cx="452" cy="110" r="1"/><circle cx="458.6" cy="110" r=".7"/>
    </g>
    <g id="cardIvory-flourishB">
      <path d="M310.2,768.8C320.1,766.7 330.5,765.7 341,765.6C351.5,765.5 361.9,766.4 371.9,768.3C375.9,769.3 378.2,771.1 379.1,773C380,774.9 379.4,776.2 377,776.8A0.2,0.2 0 0 1 377,777.2C379.6,776.8 380.5,774.6 379.6,772.8C378.8,770.9 376.1,768.7 372.1,767.7C362.1,765.6 351.5,764.5 341,764.4C330.5,764.3 319.9,765.3 309.8,767.2A0.8,0.8 0 0 1 310.2,768.8Z"/>
      <circle cx="390" cy="767" r="1.2"/><circle cx="397" cy="767" r=".9"/><circle cx="403" cy="767" r=".6"/>
    </g>
  </defs>

  <!-- gold-foil deckled (scalloped) edge -->
  <rect x="10.6" y="10.8" width="580" height="820" fill="none" stroke="#5E3F0C" stroke-width="10.4" stroke-linecap="round" stroke-dasharray="0 10"/>
  <rect x="10" y="10" width="580" height="820" fill="url(#cardIvory-foil)" stroke="url(#cardIvory-foil)" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 10"/>
  <rect x="9.4" y="9.4" width="580" height="820" fill="none" stroke="#FFF6D2" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 10" opacity=".55"/>
  <rect x="12.5" y="12.5" width="575" height="815" fill="none" stroke="#FFF3CC" stroke-width=".7" opacity=".7"/>

  <!-- ivory paper -->
  <rect x="17" y="17" width="566" height="806" fill="url(#cardIvory-paper)"/>
  <rect x="17" y="17" width="566" height="806" fill="url(#cardIvory-butaPattern)" opacity=".07"/>
  <rect x="17" y="17" width="566" height="806" fill="#000" filter="url(#cardIvory-grain)"/>
  <rect x="17" y="17" width="566" height="806" fill="none" stroke="#6E4A12" stroke-width="1" opacity=".55"/>
  <rect x="18.2" y="18.2" width="563.6" height="803.6" fill="none" stroke="#4A3008" stroke-width="1.6" opacity=".12"/>

  <g filter="url(#cardIvory-emboss)">
    <!-- fine gold dotted line, maroon rule and hairline -->
    <rect x="25" y="25" width="550" height="790" fill="none" stroke="url(#cardIvory-foil)" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 5"/>
    <rect x="33" y="33" width="534" height="774" fill="none" stroke="#6B0F24" stroke-width="1.4"/>
    <rect x="38" y="38" width="524" height="764" fill="none" stroke="url(#cardIvory-foil)" stroke-width=".9"/>
    <!-- corner diamonds on the maroon rule -->
    <g fill="url(#cardIvory-gold)" stroke="#5E3F0C" stroke-width=".5">
      <rect x="-5" y="-5" width="10" height="10" transform="translate(33 33) rotate(45)"/>
      <rect x="-5" y="-5" width="10" height="10" transform="translate(567 33) rotate(45)"/>
      <rect x="-5" y="-5" width="10" height="10" transform="translate(33 807) rotate(45)"/>
      <rect x="-5" y="-5" width="10" height="10" transform="translate(567 807) rotate(45)"/>
    </g>
    <g fill="url(#cardIvory-maroon)">
      <circle cx="33" cy="33" r="2.2"/><circle cx="567" cy="33" r="2.2"/><circle cx="33" cy="807" r="2.2"/><circle cx="567" cy="807" r="2.2"/>
    </g>

    <!-- gold lotus emblem at top centre -->
    <g fill="url(#cardIvory-foil)">
      <use href="#cardIvory-flourish"/>
      <use href="#cardIvory-flourish" transform="matrix(-1 0 0 1 600 0)"/>
    </g>
    <g transform="translate(300 106) scale(.8)">
      <g fill="url(#cardIvory-petal)" stroke="#8A6118" stroke-width="1.1">
        <use href="#cardIvory-pO" transform="rotate(-72)"/>
        <use href="#cardIvory-pO" transform="rotate(72)"/>
        <use href="#cardIvory-pM" transform="rotate(-44)"/>
        <use href="#cardIvory-pM" transform="rotate(44)"/>
        <use href="#cardIvory-pI" transform="rotate(-20)"/>
        <use href="#cardIvory-pI" transform="rotate(20)"/>
        <use href="#cardIvory-pC"/>
      </g>
      <g fill="none" stroke="#FFF3CC" stroke-width=".8" opacity=".85" stroke-linecap="round">
        <path d="M0,-7V-38"/>
        <path d="M0,-7V-35" transform="rotate(-20)"/>
        <path d="M0,-7V-35" transform="rotate(20)"/>
        <path d="M0,-7V-33" transform="rotate(-44)"/>
        <path d="M0,-7V-33" transform="rotate(44)"/>
        <path d="M0,-7V-29" transform="rotate(-72)"/>
        <path d="M0,-7V-29" transform="rotate(72)"/>
      </g>
      <path d="M-24,-1C-17,10 17,10 24,-1C15,4.5 -15,4.5 -24,-1Z" fill="url(#cardIvory-gold)" stroke="#8A6118" stroke-width=".9"/>
      <circle cy="-2" r="5" fill="url(#cardIvory-gold)" stroke="#8A6118" stroke-width=".8"/>
      <circle cy="-2" r="2.4" fill="url(#cardIvory-maroon)"/>
    </g>
    <g fill="url(#cardIvory-gold)">
      <circle cx="300" cy="62" r="1.8"/><circle cx="300" cy="55.5" r="1.3"/><circle cx="300" cy="50.5" r=".9"/>
      <circle cx="300" cy="118" r="1.6"/>
    </g>

    <!-- small closing flourish at bottom centre -->
    <g fill="url(#cardIvory-foil)">
      <use href="#cardIvory-flourishB"/>
      <use href="#cardIvory-flourishB" transform="matrix(-1 0 0 1 600 0)"/>
    </g>
    <rect x="-5" y="-5" width="10" height="10" transform="translate(300 767) rotate(45)" fill="url(#cardIvory-gold)" stroke="#5E3F0C" stroke-width=".5"/>
    <circle cx="300" cy="767" r="2" fill="url(#cardIvory-maroon)"/>
  </g>
</svg>
