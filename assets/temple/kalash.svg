      <stop offset=".45" stop-color="#8A5A2B"/>
      <stop offset=".8" stop-color="#5C3317"/>
      <stop offset="1" stop-color="#3B1F10"/>
    </radialGradient>
    <linearGradient id="kalash-leaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25472A"/>
      <stop offset=".45" stop-color="#3E6B3A"/>
      <stop offset="1" stop-color="#7E9E44"/>
    </linearGradient>
    <linearGradient id="kalash-leafBack" x1="0" y1="0" x2="1" y2="0">
