      <stop offset=".5" stop-color="#2E5230"/>
      <stop offset="1" stop-color="#5B7A33"/>
    </linearGradient>
    <linearGradient id="kalash-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E3A6"/>
      <stop offset=".5" stop-color="#C99A3E"/>
      <stop offset="1" stop-color="#6E4A12"/>
    </linearGradient>
    <filter id="kalash-soft" x="-30%" y="-100%" width="160%" height="300%">
