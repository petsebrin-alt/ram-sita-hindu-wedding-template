      <path d="M2 -16 L9 -22 M3 -28 L10.6 -36 M4 -40 L11 -49 M4.6 -52 L10 -61 M4.6 -64 L8.6 -72 M1.6 -20 L-6.4 -26 M2.6 -32 L-7.6 -40 M3.4 -44 L-7.4 -53 M4 -56 L-5.4 -65 M4.2 -68 L-2.6 -77" stroke="#B4C677" stroke-width=".55" opacity=".6"/>
    </g>
    <g id="kalash-leaf1">
