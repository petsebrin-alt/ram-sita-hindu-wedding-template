<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="kalash-brassH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5E3F0C"/>
      <stop offset=".15" stop-color="#8A6118"/>
      <stop offset=".34" stop-color="#F6E3A6"/>
      <stop offset=".5" stop-color="#D4AF5A"/>
      <stop offset=".78" stop-color="#B8862B"/>
      <stop offset="1" stop-color="#5E3F0C"/>
    </linearGradient>
    <radialGradient id="kalash-body" cx="108" cy="232" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6D2"/>
      <stop offset=".14" stop-color="#F6E3A6"/>
      <stop offset=".38" stop-color="#D4AF5A"/>
      <stop offset=".66" stop-color="#B8862B"/>
      <stop offset=".86" stop-color="#8A6118"/>
      <stop offset="1" stop-color="#5E3F0C"/>
    </radialGradient>
    <radialGradient id="kalash-coconut" cx="128" cy="78" r="70" gradientUnits="userSpaceOnUse">
